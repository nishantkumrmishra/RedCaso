[package]
name = "redcaso"
version = "1.5.0"
description = "RedCaso - High Performance Photo Scanner & Google Photos Sync"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["protocol-asset"] }
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tokio = { version = "1.43", features = ["full"] }
dirs = "6.0"
tauri-plugin-notification = "2.8.1"
rustface = "0.1.7"
